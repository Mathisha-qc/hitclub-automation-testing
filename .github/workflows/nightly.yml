name: Nightly Regression

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: |
          python3 --version
          python3 -m pip --version
          python3 -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Install Linux browser deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr xvfb

      - name: Validate required credentials
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          test -n "$BASE_URL" || (echo "Missing BASE_URL in secrets" && exit 1)
          test -n "$TEST_USERNAME" || (echo "Missing TEST_USERNAME in secrets" && exit 1)
          test -n "$TEST_PASSWORD" || (echo "Missing TEST_PASSWORD in secrets" && exit 1)

      - name: Run full nightly suite
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          source .venv/bin/activate
          mkdir -p results
          pytest tests/ --alluredir=allure-results --tb=short -v --junitxml=results/nightly-results.xml --reruns 2 --reruns-delay 5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results-${{ github.run_number }}
          path: |
            allure-results/
            results/nightly-results.xml
          if-no-files-found: warn
