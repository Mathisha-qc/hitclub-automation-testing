name: Nightly Regression

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        shell: powershell
        run: |
          python --version
          python -m pip --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Validate required credentials
        shell: powershell
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if (-not $env:BASE_URL) { throw "Missing BASE_URL in secrets" }
          if (-not $env:TEST_USERNAME) { throw "Missing TEST_USERNAME in secrets" }
          if (-not $env:TEST_PASSWORD) { throw "Missing TEST_PASSWORD in secrets" }

      - name: Run full nightly suite
        shell: powershell
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          New-Item -ItemType Directory -Path results -Force | Out-Null
          .\.venv\Scripts\pytest tests/ --alluredir=allure-results --tb=short -v --junitxml=results/nightly-results.xml --reruns 2 --reruns-delay 5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results-${{ github.run_number }}
          path: |
            allure-results/
            results/nightly-results.xml
          if-no-files-found: warn
