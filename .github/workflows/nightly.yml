name: Nightly Regression

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Show Python version
        shell: cmd
        run: |
          python --version
          python -m pip --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Validate required credentials
        shell: cmd
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if "%BASE_URL%"=="" (echo Missing BASE_URL in secrets & exit /b 1)
          if "%TEST_USERNAME%"=="" (echo Missing TEST_USERNAME in secrets & exit /b 1)
          if "%TEST_PASSWORD%"=="" (echo Missing TEST_PASSWORD in secrets & exit /b 1)

      - name: Run full nightly suite
        shell: cmd
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          if not exist results mkdir results
          .\.venv\Scripts\pytest tests/ --alluredir=allure-results --tb=short -v --junitxml=results/nightly-results.xml --reruns 2 --reruns-delay 5

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results-${{ github.run_number }}
          path: |
            allure-results/
            results/nightly-results.xml
          if-no-files-found: warn
