name: Brand Pipeline

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "core/**"
      - "pages/**"
      - "config/**"
      - "conftest.py"
      - "pytest.ini"
      - "requirements.txt"

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt

      - name: Validate BASE_URL host
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlparse

          base_url = os.getenv("BASE_URL", "").strip()
          if not base_url:
              raise SystemExit("BASE_URL secret is empty.")
          parsed = urlparse(base_url)
          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              raise SystemExit(f"BASE_URL is invalid: {base_url}")
          host = parsed.hostname
          try:
              ip = socket.gethostbyname(host)
          except Exception as exc:
              raise SystemExit(f"DNS resolution failed for '{host}': {exc}")
          print(f"Resolved {host} -> {ip}")
          PY

      - name: Run full suite
        run: |
          pytest tests/ \
          --alluredir=allure-results \
          --tb=short -v
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: develop-full-suite-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
