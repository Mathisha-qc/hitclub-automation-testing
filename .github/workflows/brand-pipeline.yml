name: Brand Pipeline

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "core/**"
      - "pages/**"
      - "config/**"
      - "conftest.py"
      - "pytest.ini"
      - "requirements.txt"

jobs:
  test-suite:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        shell: powershell
        run: |
          python --version
          python -m pip --version
          python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Validate required credentials
        shell: powershell
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          if (-not $env:BASE_URL) { throw "Missing BASE_URL in secrets" }
          if (-not $env:TEST_USERNAME) { throw "Missing TEST_USERNAME in secrets" }
          if (-not $env:TEST_PASSWORD) { throw "Missing TEST_PASSWORD in secrets" }

      - name: Run full suite
        shell: powershell
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          .\.venv\Scripts\pytest tests/ --alluredir=allure-results --tb=short -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-full-suite-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
