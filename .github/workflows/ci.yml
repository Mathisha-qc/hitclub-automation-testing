name: PR Validation

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Lint with flake8
        run: |
          # Block only on syntax/runtime-critical lint errors.
          ./.venv/bin/flake8 tests/ pages/ core/ conftest.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate BASE_URL host
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          ./.venv/bin/python - <<'PY'
          import os
          import socket
          from urllib.parse import urlparse

          base_url = os.getenv("BASE_URL", "").strip()
          if not base_url:
              raise SystemExit("BASE_URL secret is empty.")
          parsed = urlparse(base_url)
          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              raise SystemExit(f"BASE_URL is invalid: {base_url}")
          host = parsed.hostname
          try:
              ip = socket.gethostbyname(host)
          except Exception as exc:
              raise SystemExit(f"DNS resolution failed for '{host}': {exc}")
          print(f"Resolved {host} -> {ip}")
          PY

      - name: Run smoke tests
        run: |
          ./.venv/bin/pytest tests/ -m "smoke" --maxfail=1 --tb=short -q -s
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
