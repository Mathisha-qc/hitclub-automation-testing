name: PR Validation

on:
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Block only on syntax/runtime-critical lint errors.
          flake8 tests/ pages/ core/ conftest.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run smoke tests
        run: |
          pytest tests/ -m "smoke" \
          --alluredir=allure-results \
          --tb=short -q
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_CAPTCHA: ${{ secrets.TEST_CAPTCHA }}
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results-${{ github.run_number }}
          path: allure-results/
          if-no-files-found: warn
