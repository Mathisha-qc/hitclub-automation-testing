[pytest]
addopts = --tb=short -s --alluredir=allure-results --html=logs/report_%Y%m%d_%H%M%S.html --self-contained-html -v
testpaths = tests
markers =
    smoke: fast sanity check - runs on every PR (1 critical test per game)
    regression: full suite - runs in nightly CI only
    rik: tests belonging to RIK brand
    b52: tests belonging to B52 brand
    iwin: tests belonging to IWIN brand
    kclub: tests belonging to KCLUB brand
    nohu: tests belonging to NOHU brand
    tip: tests belonging to TIP brand
    win79: tests belonging to WIN79 and VIP79 brands
